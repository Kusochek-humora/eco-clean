<section class="gallery" id="gallery" aria-labelledby="gallery-title">
  <div class="container">
    <div class="gallery__box">
      <h2 class="gallery__title" id="gallery-title">
        <span class="gallery__title-accent" data-i18n="gallery.title.accent">В процессе</span>
        <span data-i18n="gallery.title.rest">уборки</span>
      </h2>

      <div class="gallery__slider swiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide gallery__slide">
            <img class="gallery__img" src="/src/assets/img/gallery-1.webp" width="310" height="426" loading="lazy" alt="Сотрудница моет стул" data-i18n-alt="gallery.slides.s1" />
          </div>
          <div class="swiper-slide gallery__slide">
            <img class="gallery__img" src="/src/assets/img/gallery-2.webp" width="310" height="426" loading="lazy" alt="Складское помещение после уборки" data-i18n-alt="gallery.slides.s2" />
          </div>
          <div class="swiper-slide gallery__slide">
            <img class="gallery__img" src="/src/assets/img/gallery-3.webp" width="310" height="426" loading="lazy" alt="Сотрудница в холле у турникетов" data-i18n-alt="gallery.slides.s3" />
          </div>
          <div class="swiper-slide gallery__slide">
            <img class="gallery__img" src="/src/assets/img/gallery-4.webp" width="310" height="426" loading="lazy" alt="Сотрудница пылесосит ковровое покрытие" data-i18n-alt="gallery.slides.s4" />
          </div>
        </div>
      </div>

      <div class="gallery__nav">
        <button class="gallery__arrow gallery__arrow--prev" type="button" aria-label="Назад" data-i18n-aria-label="gallery.prev">
          <icon name="chevron-left" class="gallery__arrow-icon"></icon>
        </button>
        <button class="gallery__arrow gallery__arrow--next" type="button" aria-label="Вперёд" data-i18n-aria-label="gallery.next">
          <icon name="chevron-left" class="gallery__arrow-icon"></icon>
        </button>
      </div>
    </div>
  </div>
</section>
